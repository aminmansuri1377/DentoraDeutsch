<svg xmlns="http://www.w3.org/2000/svg" viewBox="-35 0 930 510" role="img" aria-labelledby="title" color="#38245b" font-family="Arial,sans-serif">
<title id="title">Odontoblastenschicht, Zellkontakte und Differenzierung von Stammzellen</title>
<rect x="120" y="20" width="620" height="52" fill="#C9A227" fill-opacity=".3" stroke="currentColor" stroke-width="2"/>
<rect x="120" y="72" width="620" height="26" fill="#C9A227" fill-opacity=".14" stroke="currentColor"/>
<text x="430" y="52" font-size="17" text-anchor="middle">Dentin</text><text x="430" y="90" font-size="13" text-anchor="middle">Prädentin</text>
<g stroke="currentColor" opacity=".5"><path d="M200 20v78 M285 20v78 M370 20v78 M455 20v78 M540 20v78 M625 20v78"/></g>
<g fill="#B5679C" fill-opacity=".34" stroke="currentColor" stroke-width="2.2"><rect x="243" y="98" width="84" height="104" rx="9"/><rect x="343" y="98" width="84" height="104" rx="9"/><rect x="443" y="98" width="84" height="104" rx="9"/></g>
<g fill="#B5679C" fill-opacity=".62" stroke="currentColor"><circle cx="285" cy="168" r="16"/><circle cx="385" cy="168" r="16"/><circle cx="485" cy="168" r="16"/></g>
<path d="M285 98V34 M385 98V34 M485 98V34" stroke="currentColor" stroke-width="2.6"/>
<path d="M330 104h10 M430 104h10" stroke="#E08A3C" stroke-width="4.5" stroke-linecap="round"/>
<path d="M435 104L640 118" stroke="currentColor"/>
<g font-size="13"><text x="648" y="115">Tight Junctions</text><text x="648" y="136">Permeabilitätsbarriere</text><text x="648" y="153">Präparation kann sie stören</text></g>
<path d="M330 150h10 M330 176h10 M430 150h10 M430 176h10" stroke="#4A7FB5" stroke-width="4.5" stroke-linecap="round"/>
<path d="M240 163L128 150" stroke="currentColor"/>
<g text-anchor="end" font-size="12"><text x="120" y="147">Gap Junctions</text><text x="120" y="168">Signalübertragung</text><text x="120" y="185">Koordinierte Sekretion</text></g>
<text x="385" y="222" font-size="14" text-anchor="middle">Odontoblastenschicht: postmitotisch, keine Zellteilung</text>
<rect x="120" y="236" width="620" height="34" fill="#4A7FB5" fill-opacity=".1" stroke="currentColor" stroke-dasharray="5 4"/>
<text x="430" y="258" font-size="14" text-anchor="middle">Zellarme Zone: Raschkow-Plexus</text>
<rect x="120" y="270" width="620" height="96" fill="#B5679C" fill-opacity=".13" stroke="currentColor"/>
<g fill="#B5679C" fill-opacity=".55" stroke="currentColor"><circle cx="165" cy="300" r="7"/><circle cx="205" cy="330" r="7"/><circle cx="250" cy="298" r="7"/><circle cx="600" cy="302" r="7"/><circle cx="650" cy="332" r="7"/><circle cx="700" cy="300" r="7"/><circle cx="695" cy="345" r="7"/><circle cx="160" cy="345" r="7"/></g>
<text x="430" y="358" font-size="14" text-anchor="middle">Zellreiche Zone: Stammzellreservoir</text>
<circle cx="385" cy="308" r="15" fill="#3F9E6B" fill-opacity=".55" stroke="currentColor"/>
<text x="385" y="313" font-size="12" text-anchor="middle">Mesenchymale Stammzelle</text>
<defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#3F9E6B"/></marker></defs>
<path d="M385 326V398" stroke="#3F9E6B" stroke-width="3" marker-end="url(#ar)"/>
<text x="402" y="390" font-size="13">Differenzierung</text>
<rect x="270" y="400" width="230" height="40" rx="8" fill="#3F9E6B" fill-opacity=".22" stroke="currentColor"/>
<text x="385" y="425" font-size="13" text-anchor="middle">Odontoblastenähnliche Zelle</text>
<path d="M500 420H600" stroke="#3F9E6B" stroke-width="3" marker-end="url(#ar)"/>
<rect x="606" y="400" width="150" height="40" rx="8" fill="#C9A227" fill-opacity=".28" stroke="currentColor"/>
<text x="681" y="418" font-size="13" text-anchor="middle">Reparaturdentin</text><text x="681" y="434" font-size="10" text-anchor="middle">unregelmäßig, tubulusarm</text>
<g font-size="12"><text x="120" y="412">Abgestorbener</text><text x="120" y="430">Odontoblast: Ersatz,</text><text x="120" y="448">aber keine Teilung</text></g>
<path d="M120 470H740" stroke="currentColor" opacity=".3"/><text x="430" y="490" font-size="12" text-anchor="middle">Ersatz durch Differenzierung, nicht durch Teilung – kein gleichwertiges ursprüngliches Dentin.</text>
</svg>
